CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_NEWLIB_LIBC=y
CONFIG_I2C=y
CONFIG_SPI=y
CONFIG_SENSOR=y

# Watchdog / RTC
CONFIG_WATCHDOG=y
CONFIG_WDT_DISABLE_AT_BOOT=y
CONFIG_RTC=y

# Heap
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_NEWLIB_LIBC_MIN_REQUIRED_HEAP_SIZE=4096

# Threading
CONFIG_PRINTK=y
CONFIG_ASSERT=y
CONFIG_MAIN_STACK_SIZE=4096

# JSON
CONFIG_JSON_LIBRARY=y


# Networking core
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_DHCPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_POSIX_API=y
CONFIG_DNS_RESOLVER=n
CONFIG_DNS_RESOLVER_MAX_SERVERS=2
CONFIG_HTTP_CLIENT=y

# WiFi
CONFIG_WIFI=y
CONFIG_WIFI_ESWIFI=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y

# Network buffers
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_TX_COUNT=16
CONFIG_NET_TX_STACK_SIZE=4096
CONFIG_NET_RX_STACK_SIZE=4096
CONFIG_NET_BUF_DATA_SIZE=256

# Logging
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_PROCESS_THREAD=y
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=1024

# Force immediate/synchronous output instead of deferred
CONFIG_LOG_MODE_IMMEDIATE=y

# Make sure UART backend is active
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_BACKEND_UART_OUTPUT_TEXT=y

# printk also goes to UART
CONFIG_PRINTK=y

CONFIG_WIFI_LOG_LEVEL_INF=y
CONFIG_NET_LOG=n


CONFIG_LOG_MODE_MINIMAL=y
CONFIG_LOG_BUFFER_SIZE=512